spring.application.name=EvidenceVault
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/evidencevault?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.thymeleaf.cache=false
server.error.whitelabel.enabled=false
server.forward-headers-strategy=framework
app.storage.path=${STORAGE_PATH:./storage/evidence}
app.max-file-size=${MAX_FILE_SIZE:20971520}
app.security.hsts=${SECURITY_HSTS:false}
app.malware-scan.enabled=${MALWARE_SCAN_ENABLED:false}
app.malware-scan.host=${MALWARE_SCAN_HOST:127.0.0.1}
app.malware-scan.port=${MALWARE_SCAN_PORT:3310}
app.login.max-failures=${LOGIN_MAX_FAILURES:5}
app.login.lock-minutes=${LOGIN_LOCK_MINUTES:15}
app.login.rate-limit-per-minute=${LOGIN_RATE_LIMIT_PER_MINUTE:10}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.admin-password=${ADMIN_PASSWORD:}
app.seed.investigator-password=${INVESTIGATOR_PASSWORD:}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
