<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>EvidenceVault | New Case</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/app.css">
</head>
<body class="form-page">
<div class="container py-5 form-shell">
    <div class="row justify-content-center"><div class="col-lg-7">
        <a href="/cases" class="back-dashboard"><span>←</span> All Cases</a>
        <div class="card p-4 mt-3 form-card">
            <div class="eyebrow">CASE REGISTRATION</div>
            <h1 class="h3">Create Investigation Case</h1>
            <p class="muted">Register a new investigation before evidence is collected.</p>
            <form method="post" action="/cases">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <label class="form-label" for="title">Case Title</label>
                <input id="title" name="title" class="form-control mb-3" required maxlength="200" placeholder="Example: Phishing Incident - November 2026">
                <label class="form-label" for="description">Description</label>
                <textarea id="description" name="description" class="form-control mb-3" rows="5" placeholder="Describe the investigation scope..."></textarea>
                <label class="form-label" for="investigationType">Investigation Type</label>
                <select id="investigationType" name="investigationType" class="form-select mb-4" required>
                    <option value="">Select type</option><option>Cybercrime</option><option>Malware Incident</option><option>Data Breach</option><option>Phishing</option><option>Digital Fraud</option><option>Insider Threat</option><option>Other</option>
                </select>
                <div class="form-actions"><button class="btn btn-primary" type="submit"><span>＋</span> Create Case</button><a href="/cases" class="form-cancel">Cancel</a></div>
            </form>
        </div>
    </div></div>
</div>
<script id="ev-motion-init">(function(){document.documentElement.classList.add("ev-motion-init");document.querySelectorAll(".reveal-panel").forEach(function(el,i){if(!el.style.animationDelay)el.style.animationDelay=Math.min(i*70,420)+"ms"});})();</script></body>
</html>
