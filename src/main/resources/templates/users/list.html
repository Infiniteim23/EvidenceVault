<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EvidenceVault | Users</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="/css/app.css"></head>
<body><div class="container py-4"><a href="/dashboard" class="small">← Dashboard</a><div class="mt-3"><div class="eyebrow">ADMINISTRATION</div><h1 class="h3">User Management</h1><p class="muted">Administrative view of EvidenceVault accounts and roles.</p></div><div class="card p-3"><div class="table-responsive"><table class="table"><thead><tr><th>Username</th><th>Email</th><th>Role</th><th>Enabled</th><th>Created</th></tr></thead><tbody><tr th:each="u:${users}"><td th:text="${u.username}"></td><td th:text="${u.email}"></td><td><span class="status-pill" th:text="${u.role.name}"></span></td><td th:text="${u.enabled ? 'YES' : 'NO'}"></td><td th:text="${u.createdAt}"></td></tr></tbody></table></div></div></div><script id="ev-motion-init">(function(){document.documentElement.classList.add("ev-motion-init");document.querySelectorAll(".reveal-panel").forEach(function(el,i){if(!el.style.animationDelay)el.style.animationDelay=Math.min(i*70,420)+"ms"});})();</script></body></html>
